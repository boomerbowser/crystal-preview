# Capture the visual baselines on the runner that compares against them.
#
# D-15: `validation/baselines` are captured on a contributor's machine.
# Comparing them here failed 16 of 18 frames, with channel deltas to 255,
# worst on the text-heavy ones, because a GitHub runner does not rasterise
# type the way that machine does. A tolerance cannot correct for a different
# renderer, because a baseline is only valid for the renderer that produced it.
#
# So there are two sets. `validation/baselines` is the desk set, re-blessed by a
# person who looked at the images. `validation/baselines-ci` is this set,
# produced here and committed, and it is what `Verify` compares against.
#
# Run this by hand when a frame legitimately changes, download the artifact, and
# commit it in the same commit as the change that caused it, as the desk set
# requires. The runner image is pinned rather than `ubuntu-latest` because this
# job exists to keep the renderer the same.
name: Capture runner baselines

on:
  workflow_dispatch:

jobs:
  capture:
    name: Capture the frame set here
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: pip install -r tools/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Start the site
        run: |
          python3 tools/serve.py &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:4321/ >/dev/null && exit 0
            sleep 0.5
          done
          echo "::error::The site did not come up on 127.0.0.1:4321"
          exit 1

      - name: Capture
        run: npm run capture:frames -- --out "$RUNNER_TEMP/baselines-ci"

      # Nothing is verified here: there is nothing to compare against yet. The
      # same commit's `Verify` run compares against exactly these files, and a
      # person looks at them before committing them. The frames the capture
      # produced are the artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: runner-baselines
          path: ${{ runner.temp }}/baselines-ci
          if-no-files-found: error
